kind = "web"
previewPath = "/"
title = "NexoShop Bot"
version = "1.0.0"
id = "artifacts/status"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25104

[services.development]
run = "pnpm --filter @workspace/status run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "run", "build:production" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "25104"
BASE_PATH = "/"
